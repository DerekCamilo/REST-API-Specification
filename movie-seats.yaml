openapi: 3.0.4
info:
  title: Movie Theater Seat Reservation API
  description: This API lets customers reserve seats for a movie, view their reservation, or cancel it before purchasing tickets.
  version: 1.0.0

servers:
  - url: http://movietics.com
    description: Production/Live server for movietics.com
  - url: http://movietics-dev.com/api
    description: Development server for movietics.com

paths:
  /reservations:
    post:
      summary: Reserve seats for a movie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                showtimeId:
                  type: integer
                seatIds:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Seats reserved successfully
        '409':
          description: Selected seats are unavailable

  /reservations/{reservationId}:
    get:
      summary: View a seat reservation
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reservation found
        '404':
          description: Reservation not found

    delete:
      summary: Cancel a seat reservation
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Reservation canceled
        '404':
          description: Reservation not found
        '409':
          description: Reservation cannot be canceled
